name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: telegrambotacr
  APP_NAME: nucleo-io
  RESOURCE_GROUP: telegram-bot-rg-west
  ACR_USERNAME: telegrambotacr
  AKS_CLUSTER: telegram-bot-aks
  NAMESPACE: telegram-bot

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        cd Nucleo
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        cd Nucleo
        python -m unittest test_list_utils.py -v

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.ACR_NAME }}.azurecr.io
        username: ${{ env.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push container image
      uses: docker/build-push-action@v5
      with:
        context: ./Nucleo
        push: true
        tags: ${{ env.ACR_NAME }}.azurecr.io/telegram-bot:latest

    - name: Set up kubelogin for non-interactive login
      uses: azure/use-kubelogin@v1
      with:
        kubelogin-version: 'v0.0.25'

    - name: Get AKS Credentials
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ env.RESOURCE_GROUP }}
        cluster-name: ${{ env.AKS_CLUSTER }}
        admin: 'false'
        use-kubelogin: 'true'

    - name: Restart Kubernetes Deployment
      run: |
        # Delete existing pods to force pull of new image
        kubectl delete pods -n ${{ env.NAMESPACE }} -l app=telegram-bot
        # Wait for new pods to be ready
        kubectl rollout status deployment/telegram-bot -n ${{ env.NAMESPACE }} --timeout=300s

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.APP_NAME }}
        resource-group: ${{ env.RESOURCE_GROUP }}
        images: ${{ env.ACR_NAME }}.azurecr.io/telegram-bot:latest 