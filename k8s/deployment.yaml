apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bot
  labels:
    app: telegram-bot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telegram-bot
  template:
    metadata:
      labels:
        app: telegram-bot
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: telegram-bot
        image: telegrambotacr.azurecr.io/telegram-bot:latest
        ports:
        - containerPort: 8080
        env:
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegram-secrets
              key: token
        - name: COSMOS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: telegram-secrets
              key: cosmos_endpoint
        - name: COSMOS_KEY
          valueFrom:
            secretKeyRef:
              name: telegram-secrets
              key: cosmos_key
        - name: KEY_VAULT_NAME
          valueFrom:
            secretKeyRef:
              name: telegram-secrets
              key: key_vault_name
        - name: KEY_VAULT_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: telegram-secrets
              key: key_vault_tenant_id
        - name: KEY_VAULT_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: telegram-secrets
              key: key_vault_client_id
        - name: KEY_VAULT_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: telegram-secrets
              key: key_vault_client_secret
        - name: DATABASE_NAME
          value: "telegrambot"
        - name: CONTAINER_NAME
          value: "users"
        - name: WEBHOOK_URL
          value: "https://nucleo-io.azurewebsites.net/webhook"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: telegram-bot-service
spec:
  selector:
    app: telegram-bot
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: telegram-bot-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: nucleo-io.azurewebsites.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: telegram-bot-service
            port:
              number: 80 